<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>בית ספר למכירות · נגן לימוד</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600&display=swap">
<style>
/* פריסה: מסך אחד. השקף בגדול, אבי בעיגול בפינה השמאלית התחתונה של השקף, פקדים ורצועת שקפים מתחת */
:root {
  --navy: #14213D; --orange: #E8833A; --teal: #1F7A8C; --paper: #FBF8F2; --line: #E3DCCD; --muted: #5C6478;
  --head: 'Rubik', Arial, sans-serif; --body: 'Assistant', Arial, sans-serif;
  --cam: 180px;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--paper); color: var(--navy); font-family: var(--body); font-size: 16px }
header { background: var(--navy); color: var(--paper); padding: 0 max(16px, 3vw); display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
header h1 { font-family: var(--head); font-size: 19px; margin: 0; padding: 10px 0 }
header h1 small { font-family: var(--body); font-weight: 400; color: #B9C2D6; font-size: 14px; margin-inline-start: 8px }
nav { display: flex; gap: 2px; overflow-x: auto; margin-inline-start: auto }
nav button { font-family: var(--head); font-size: 15px; font-weight: 500; color: #C9D1E2; background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 12px 12px 9px; cursor: pointer; white-space: nowrap }
nav button[aria-selected="true"] { color: #fff; border-bottom-color: var(--orange) }
button:focus-visible, .thumb:focus-visible, .prog:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px }
main { padding: 12px max(16px, 3vw) 28px; display: flex; flex-direction: column; gap: 10px; align-items: center }
.wrap { width: min(100%, calc((100vh - 215px) * 16 / 9)); min-width: min(100%, 640px); display: flex; flex-direction: column; gap: 10px }
.lesson-title { font-family: var(--head); font-size: 17px; margin: 0 }
.lesson-title span { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 15px }

/* השקף והעיגול */
.stage { position: relative; aspect-ratio: 16 / 9; background: #fff; border: 1px solid var(--line); border-radius: 8px }
.stage > img { width: 100%; height: 100%; display: block; object-fit: contain; border-radius: 8px }
.camwrap { position: absolute; left: 14px; bottom: 14px; z-index: 2 }
.cam { position: relative; width: var(--cam); height: var(--cam); border-radius: 50%; overflow: hidden; background: #000; border: 4px solid #fff; box-shadow: 0 6px 22px rgba(20, 33, 61, .35); transition: width .25s, height .25s, border-radius .25s }
.cam .vid { position: absolute; top: 0; height: 100%; width: 177.78%; left: -38.89% }
.cam .vid iframe { width: 100%; height: 100%; display: block; border: 0 }
.shield { position: absolute; inset: 0; cursor: pointer; display: grid; place-items: center }
.shield .ic { width: 46px; height: 46px; border-radius: 50%; background: rgba(20, 33, 61, .7); color: #fff; display: grid; place-items: center; font-size: 20px; opacity: 0; transition: opacity .2s }
.shield:hover .ic, .paused .shield .ic { opacity: 1 }
.big .cam { width: min(46vw, calc(var(--stageW) * .46)); height: calc(min(46vw, calc(var(--stageW) * .46)) * 9 / 16); border-radius: 10px }
.big .cam .vid { width: 100%; left: 0 }
.size { position: absolute; top: -6px; right: -6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--orange); color: #fff; font-size: 15px; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); display: grid; place-items: center }
.tap { position: absolute; inset: auto 0 -30px 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--orange); white-space: nowrap }
.tap[hidden] { display: none }
.tapmode .shield { pointer-events: none }

/* פקדי נגינה */
.player { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; border-radius: 8px; padding: 8px 12px }
.player button { background: transparent; border: 0; color: #fff; font-family: var(--head); font-size: 15px; cursor: pointer; padding: 4px 6px; border-radius: 4px; min-width: 32px }
.player button:hover { background: rgba(255, 255, 255, .1) }
.prog { position: relative; flex: 1; height: 26px; cursor: pointer; touch-action: none; min-width: 0 }
.prog .track { position: absolute; inset: 11px 0; background: rgba(255, 255, 255, .22); border-radius: 2px }
.prog .fill { position: absolute; top: 11px; bottom: 11px; right: 0; background: var(--orange); border-radius: 2px }
.prog .tick { position: absolute; top: 8px; width: 2px; height: 10px; background: #fff; opacity: .7; transform: translateX(50%) }
.prog .knob { position: absolute; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translateX(50%) }
.time, #speed { direction: ltr; unicode-bidi: isolate }
.time { font-variant-numeric: tabular-nums; font-size: 14px; color: #D5DBE8; white-space: nowrap }

.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.bar button { font-family: var(--head); font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--navy); border-radius: 6px; padding: 7px 12px; cursor: pointer }
.bar button:hover { border-color: var(--teal) }
.pos { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px }
.follow { margin-inline-start: auto; font-size: 14px; color: var(--muted) }
.follow.off { color: var(--orange); font-weight: 600 }
#resume { background: var(--orange); color: #fff; border-color: var(--orange) }
#resume[hidden] { display: none }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scroll-behavior: smooth }
.thumb { flex: 0 0 auto; width: 128px; border: 2px solid transparent; border-radius: 6px; background: none; padding: 0; cursor: pointer; text-align: center; font-family: var(--body); color: var(--muted) }
.thumb img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 4px; border: 1px solid var(--line); background: #fff }
.thumb span { display: block; font-size: 12px; padding: 2px 0; font-variant-numeric: tabular-nums }
.thumb.on { border-color: var(--orange) }
.thumb.on span { color: var(--navy); font-weight: 600 }

@media (max-width: 700px) {
  :root { --cam: 76px }
  header h1 { padding: 8px 0 0 }
  header h1 small { display: none }
  nav { margin-inline-start: 0 }
  .wrap { min-width: 0 }
  .camwrap { left: 8px; bottom: 8px }
  .cam { border-width: 3px }
  .big .cam { width: 62vw; height: calc(62vw * 9 / 16) }
  .size { width: 26px; height: 26px; font-size: 13px }
  .player { flex-wrap: wrap; row-gap: 2px }
  .prog { flex-basis: 100%; order: -1 }
  .follow { margin-inline-start: 0; flex-basis: 100% }
  .thumb { width: 104px }
}
@media (prefers-reduced-motion: reduce) { .strip { scroll-behavior: auto } .cam { transition: none } }
</style>
</head>
<body>
<header>
  <h1>בית ספר למכירות<small>אבי קובנר · הסרטון והמצגת יחד</small></h1>
  <nav id="tabs" role="tablist"></nav>
</header>
<main>
  <div class="wrap" id="wrap">
    <h2 class="lesson-title" id="ltitle"></h2>
    <div class="stage" id="stage">
      <img id="cur" alt="">
      <div class="camwrap paused" id="camwrap">
        <div class="cam"><div class="vid"><div id="yt"></div></div><div class="shield" id="shield" title="נגן / עצור"><span class="ic" id="shieldIc">▶</span></div></div>
        <button class="size" id="size" type="button" aria-label="הגדלת הסרטון" title="הגדלה / הקטנה">⤢</button>
        <div class="tap" id="tap" hidden>הקש על הסרטון להפעלה</div>
      </div>
    </div>
    <div class="player">
      <button id="play" type="button" aria-label="נגן">▶</button>
      <div class="prog" id="prog" role="slider" tabindex="0" aria-label="מיקום בסרטון"><div class="track"></div><div class="fill" id="fill"></div><div id="ticks"></div><div class="knob" id="knob"></div></div>
      <span class="time" id="time">0:00 / 0:00</span>
      <button id="speed" type="button" aria-label="מהירות">1×</button>
      <button id="mute" type="button" aria-label="השתקה">🔊</button>
    </div>
    <div class="bar">
      <button id="back" type="button">→ הקודם</button>
      <span class="pos" id="pos"></span>
      <button id="fwd" type="button">הבא ←</button>
      <button id="jump" type="button">▶ נגן מהשקף הזה</button>
      <span class="follow" id="follow">השקף מתחלף לפי הסרטון</span>
      <button id="resume" type="button" hidden>חזרה לסרטון</button>
    </div>
    <div class="strip" id="strip"></div>
  </div>
</main>
<script>
// end: איפה ההדרכה נגמרת. בשיעור 1 אחרי 90:02 יש שקט ואחריו מפגש זום אחר, ולכן הסרטון נעצר שם
const L = [
  { id: 'q741ABN4sFE', end: 5402, title: 'שיעור 1 · מהפנייה הראשונה ועד שיחת הטלפון', ch: [2,8,16,21,25,31,36,42,48,56],
    t: [0,8,15,45,255,405,450,521,525,555,585,630,720,840,883,926,930,945,990,1050,1136,1140,1148,1155,1226,1230,1275,1395,1440,1980,1991,1995,2055,2115,2175,2175,2175,2190,2215,2241,2266,2291,2295,2415,2490,2595,2700,2711,2715,2730,2850,2970,3195,3229,3262,3296,3300,3420,3480,3735,3840,4005,4155,4455,4560,4620,4980,5175,5295,5351,5396,5401,5406,5411,5416,5421,5426,5431,5436,5441,5446] },
  { id: '9xRrPZaBLPQ', end: 4000, title: 'שיעור 2 · שיחת הטלפון עם הלקוח', ch: [2,8,15,23,27,33,38,44,50,56],
    t: [0,30,60,83,105,180,360,401,405,443,480,555,690,795,1016,1020,1035,1103,1170,1200,1350,1395,1466,1470,1553,1635,1991,1995,2055,2115,2220,2295,2381,2385,2430,2565,2685,2685,2685,2760,2880,2985,3090,3266,3270,3323,3375,3420,3495,3551,3555,3578,3600,3705,3795,3821,3825,3848,3870,3900,3956,3970,3975,3980,3985,3990,3995,4000,4005,4010,4015] },
  { id: '50ChYS_oraw', end: 5926, title: 'שיעור 3 · התנגדויות בדרך לסגירה', ch: [2,9,14,21,28,36],
    t: [0,45,90,105,180,270,375,600,731,735,825,960,1050,1166,1170,1268,1365,1515,1605,1710,1781,1785,1800,1860,1950,2025,2145,2246,2250,2280,2310,2445,2595,2700,2895,2951,2955,3053,3150,3660,3975,4155,4500,4650,4800,4905,5055,5370,5520,5640,5756,5801,5806,5811,5816,5821,5826,5831,5836,5841] },
  { id: '1ZVW3DmvBN8', end: 4210, title: 'שיעור 4 · כל התהליך, וסימולציה חיה', ch: [2,9,18,29],
    t: [0,45,90,120,150,435,480,705,746,750,840,930,945,1020,1125,1200,1275,1346,1350,1425,1500,1575,1695,1830,1890,2010,2070,2190,2291,2295,2325,2370,2520,2640,2730,2835,2880,2970,3045,3285,3480,3555,3630,3705,3840,3870,4035,4035,4035,4035,4080,4085,4090,4095,4100,4105,4110] },
];
// שקפים עם אותו זמן מקבלים 20 שניות כל אחד, ואף שקף לא נופל אחרי סוף ההדרכה
for (const l of L) {
  for (let i = 1; i < l.t.length; i++) if (l.t[i] <= l.t[i - 1]) l.t[i] = l.t[i - 1] + 20;
  for (let i = l.t.length - 1; i > 0; i--) l.t[i] = Math.min(l.t[i], (i === l.t.length - 1 ? l.end - 2 : l.t[i + 1] - 2));
}

const $ = (id) => document.getElementById(id);
const fmt = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let lesson = 0, idx = 0, follow = true, player = null, ready = false, dragging = false;
const SPEEDS = [1, 1.25, 1.5, 2];
const saved = store.get('avi-player') || {};
const fromHash = /^#lesson([1-4])$/.exec(location.hash);
lesson = fromHash ? +fromHash[1] - 1 : (saved.lesson ?? 0);

L.forEach((l, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.role = 'tab'; b.textContent = `שיעור ${i + 1}`;
  b.onclick = () => openLesson(i, true);
  $('tabs').appendChild(b);
});

const src = (i) => `s${lesson + 1}/${i + 1}.jpg`;
const now = () => (ready && player.getCurrentTime ? player.getCurrentTime() : (saved.pos && saved.pos[lesson]) || 0);

function show(i, scroll = true) {
  const l = L[lesson];
  idx = Math.max(0, Math.min(l.t.length - 1, i));
  $('cur').src = src(idx);
  $('cur').alt = `שקף ${idx + 1}`;
  $('pos').textContent = `שקף ${idx + 1} מתוך ${l.t.length}`;
  if (idx + 1 < l.t.length) new Image().src = src(idx + 1);
  document.querySelectorAll('.thumb').forEach((t, k) => t.classList.toggle('on', k === idx));
  if (scroll) {
    const t = $('strip').children[idx], st = $('strip');
    if (t) st.scrollBy({ left: t.getBoundingClientRect().left - st.getBoundingClientRect().left - st.clientWidth / 2 + t.clientWidth / 2 });
  }
}

function setFollow(on) {
  follow = on;
  $('follow').textContent = on ? 'השקף מתחלף לפי הסרטון' : 'דפדוף חופשי: השקף לא זז עם הסרטון';
  $('follow').classList.toggle('off', !on);
  $('resume').hidden = on;
  if (on) tick();
}

function openLesson(i, user) {
  lesson = i;
  const l = L[i];
  document.querySelectorAll('#tabs button').forEach((b, k) => b.setAttribute('aria-selected', k === i));
  $('ltitle').textContent = l.title;
  $('strip').innerHTML = '';
  l.t.forEach((t, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'thumb';
    b.innerHTML = `<img loading="lazy" alt="שקף ${k + 1}" src="${src(k)}"><span>${k + 1} · ${fmt(t)}</span>`;
    b.onclick = () => { setFollow(true); seek(t, true); show(k); };
    $('strip').appendChild(b);
  });
  $('ticks').innerHTML = l.ch.map((k) => `<div class="tick" style="right:${(l.t[k] / l.end) * 100}%"></div>`).join('');
  const start = Math.min((saved.pos && saved.pos[i]) || 0, l.end - 5);
  show(slideAt(start));
  setFollow(true);
  drawProg(start);
  if (ready) {
    const opts = { videoId: l.id, startSeconds: start, endSeconds: l.end };
    user ? player.loadVideoById(opts) : player.cueVideoById(opts);
  }
  if (user) try { history.replaceState(null, '', '#lesson' + (i + 1)); } catch {}
  saved.lesson = i; store.set('avi-player', saved);
}

function slideAt(sec) { const t = L[lesson].t; let k = 0; while (k + 1 < t.length && t[k + 1] <= sec + 0.5) k++; return k; }
function playing() { return ready && [1, 3].includes(player.getPlayerState()); }
function play() {
  if (!ready) return;
  player.playVideo();
  // בטלפון לפעמים חייבים לגעת בסרטון עצמו: אם הוא לא התחיל, מגדילים אותו ומאפשרים הקשה ישירה
  setTimeout(() => { if (!playing()) { $('camwrap').classList.add('big', 'tapmode'); $('tap').hidden = false; } }, 1500);
}
function seek(t, autoplay) { if (!ready) return; player.seekTo(Math.min(t, L[lesson].end - 1), true); if (autoplay && !playing()) play(); drawProg(t); }

function drawProg(t) {
  const p = Math.max(0, Math.min(1, t / L[lesson].end)) * 100;
  $('fill').style.width = p + '%';
  $('knob').style.right = p + '%';
  $('time').textContent = `${fmt(t)} / ${fmt(L[lesson].end)}`;
}
function tick() {
  const t = now();
  if (!dragging) drawProg(t);
  if (follow) { const k = slideAt(t); if (k !== idx) show(k); }
  if (ready) {
    const on = playing();
    $('play').textContent = on ? '❚❚' : '▶';
    $('play').setAttribute('aria-label', on ? 'עצור' : 'נגן');
    $('shieldIc').textContent = on ? '❚❚' : '▶';
    $('camwrap').classList.toggle('paused', !on);
    if (on && !$('tap').hidden) { $('tap').hidden = true; $('camwrap').classList.remove('tapmode'); }
    if (t > 1) { saved.pos = saved.pos || {}; saved.pos[lesson] = Math.floor(t); }
  }
}
setInterval(tick, 400);
setInterval(() => store.set('avi-player', saved), 5000);

function toggle() { if (!ready) return; playing() ? player.pauseVideo() : play(); setTimeout(tick, 150); }
$('play').onclick = toggle;
$('shield').onclick = toggle;
$('size').onclick = () => {
  const big = $('camwrap').classList.toggle('big');
  $('size').textContent = big ? '⤡' : '⤢';
  $('size').setAttribute('aria-label', big ? 'הקטנת הסרטון לעיגול' : 'הגדלת הסרטון');
};
$('speed').onclick = () => {
  if (!ready) return;
  const s = SPEEDS[(SPEEDS.indexOf(player.getPlaybackRate()) + 1) % SPEEDS.length] || 1;
  player.setPlaybackRate(s); $('speed').textContent = s + '×';
};
$('mute').onclick = () => {
  if (!ready) return;
  player.isMuted() ? player.unMute() : player.mute();
  setTimeout(() => { $('mute').textContent = player.isMuted() ? '🔇' : '🔊'; }, 100);
};

// פס ההתקדמות: מימין לשמאל, לחיצה וגרירה
const posFrom = (e) => { const r = $('prog').getBoundingClientRect(); return Math.max(0, Math.min(1, (r.right - e.clientX) / r.width)) * L[lesson].end; };
$('prog').addEventListener('pointerdown', (e) => { dragging = true; $('prog').setPointerCapture(e.pointerId); drawProg(posFrom(e)); });
$('prog').addEventListener('pointermove', (e) => { if (dragging) { const t = posFrom(e); drawProg(t); if (follow) show(slideAt(t), false); } });
$('prog').addEventListener('pointerup', (e) => { if (!dragging) return; dragging = false; setFollow(true); seek(posFrom(e), false); });
$('prog').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { seek(now() + 10); e.preventDefault(); }
  if (e.key === 'ArrowRight') { seek(now() - 10); e.preventDefault(); }
});

$('fwd').onclick = () => { setFollow(false); show(idx + 1); };
$('back').onclick = () => { setFollow(false); show(idx - 1); };
$('resume').onclick = () => setFollow(true);
$('jump').onclick = () => { setFollow(true); seek(L[lesson].t[idx], true); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,.prog')) return;
  if (e.key === 'ArrowLeft') $('fwd').click();
  if (e.key === 'ArrowRight') $('back').click();
  if (e.key === ' ') { e.preventDefault(); toggle(); }
});
const sizeVar = () => document.documentElement.style.setProperty('--stageW', $('stage').clientWidth + 'px');
addEventListener('resize', sizeVar); sizeVar();

openLesson(lesson, false);

window.onYouTubeIframeAPIReady = () => {
  const l = L[lesson];
  player = new YT.Player('yt', {
    videoId: l.id,
    playerVars: { start: Math.min((saved.pos && saved.pos[lesson]) || 0, l.end - 5), end: l.end, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, iv_load_policy: 3, modestbranding: 1, hl: 'he' },
    events: { onReady: () => { ready = true; tick(); } },
  });
};
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body>
</html>
